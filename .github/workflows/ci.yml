name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm history:check
      - run: pnpm privacy:check
      - run: pnpm release:verify
      - run: pnpm release:package
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: env -u CODEX_APP_SERVER_ENDPOINT -u CODEX_HOME uv run --no-project --with-requirements requirements-dev.txt pytest -q tests
  gate:
    name: CI gate
    if: always()
    needs: [web, python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          WEB: ${{ needs.web.result }}
          PYTHON: ${{ needs.python.result }}
        run: test "$WEB" = success && test "$PYTHON" = success
